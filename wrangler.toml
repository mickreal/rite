name = "rite"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# rite.report is a Custom Domain on this Worker (Cloudflare makes the DNS record and certificate). workers.dev stays on so
# the Stripe webhook endpoint (rite.mickreal.workers.dev/webhook/stripe) and old links keep working.
routes = [{ pattern = "rite.report", custom_domain = true }]
workers_dev = true

[vars]
SITE_URL = "https://rite.report"
PRICE_FULL_CENTS = "2900"
PRICE_NOTIME_CENTS = "1900"
PRICE_SEASON_MONTHLY_CENTS = "700"
PRICE_SEASON_YEARLY_CENTS = "5900"
CURRENCY = "usd"
# Stripe Tax (docs/automation-builds.md §1). "on": automatic_tax + required billing address on every Checkout, tax-inclusive
# prices (tax_behavior "inclusive", tax code txcd_10000000). Stripe Tax must be activated in the dashboard first, or every
# Checkout errors: set "off" until then (launch checklist B10). "off" = exactly the behaviour before tax.
STRIPE_TAX = "off"
# Local prices (GBP/EUR/AUD/CAD), off by default. Set to JSON of currency -> cents per product, e.g.
# '{"gbp":{"full":2300,"notime":1500,"gift":2300,"bump":1200,"season_month":600,"season_year":4700}}' (also full_b / notime_b
# for arm B of the price test). When set, Checkout uses Stripe Prices with currency_options, so buyers see their own currency.
LOCAL_PRICES = ""
# Order bump on the reading Checkout: "Add a reading for someone else" (a gift code). "0" turns the bump off.
PRICE_BUMP_CENTS = "1500"
# Price test (growth plan): "on" splits new previews 50/50 between arm A (the prices above) and arm B (these). Stops itself
# after 14 days or 600 previews per arm and logs price_test_done with the winner; previews keep the price they were shown.
PRICE_TEST = "off"
PRICE_TEST_B_FULL_CENTS = "3900"
PRICE_TEST_B_NOTIME_CENTS = "2500"
# Gift season: the gift banner on /, /p/:id and /r/:tok between these dates (inclusive, UTC), and the gift email to past
# buyers on 1 and 15 Dec inside them.
GIFT_SEASON_START = "2026-11-15"
GIFT_SEASON_END = "2026-12-22"
# Year-ahead reading (docs/automation-builds.md §11): the next 12 months of Saturn for an existing reading, $19 (tax-inclusive
# like the others; a Stripe Price under lookup key rite_year_ahead_<cents>_usd_<live|test>[_v2], made by the code on first
# checkout; LOCAL_PRICES can price "year_ahead"). YEAR_AHEAD: "off" sells and offers nothing (bought ones still open);
# "page" sells it and shows it on the reading page; "on" also sends the offer emails (the reading's anniversary and
# YEAR_AHEAD_JANUARY, MM-DD, from 09:00 in the buyer's birthplace zone). Needs migration 010 (npm run db:migrate:b11).
YEAR_AHEAD = "off"
PRICE_YEAR_AHEAD_CENTS = "1900"
YEAR_AHEAD_JANUARY = "01-05"
MODEL_REPORT = "claude-sonnet-5-5"
MODEL_PREVIEW = "claude-haiku-5-5"
TTS_VOICE = "luna"
ADMIN_EMAIL = "mail@mickreal.com"
POSTHOG_KEY = "phc_ybwtQEUxfgYeRSpCMHFL5uJX5GBHUv4JDzxx7HUPvh3T"
POSTHOG_HOST = "https://us.i.posthog.com"
POSTHOG_PROJECT_ID = "668507"   # the Rite project; with the POSTHOG_PERSONAL_API_KEY secret, visits appear in the Monday KPI email
FROM_EMAIL = "Rite <hello@rite.report>"
SUPPORT_EMAIL = "hello@rite.report"
# Support inbox (docs/automation-builds.md §3): Email Routing sends hello@ to this Worker's email() handler. "off" = watch
# mode: every message is stored, classified and sent to ADMIN_EMAIL with a drafted reply and what it would do; nothing
# goes to the customer and no refund/stop/delete runs. "on" = acts inside the support macros (launch checklist, after
# 3–5 days of correct drafts). ADMIN_EMAIL must be a verified Email Routing destination for the original to be forwarded.
INBOX_AUTO = "off"
INBOX_REFUNDS_PER_DAY = "20"         # automatic refunds per rolling 24h; past either cap, refunds go to Mick
INBOX_REFUND_CENTS_PER_DAY = "50000" # $500
# Creator program (docs/automation-builds.md §8). CREATORS switches payouts only: "off" (default) runs none, "dry" works out
# the 1st-of-month payouts and emails them to ADMIN_EMAIL without calling Stripe, "on" sends Stripe Connect transfers.
# Attribution (code or ?c= link, 30-day cookie) and the commission ledger run in every mode. Needs migration 008
# (npm run db:migrate:b8) and, for "on", Stripe Connect (Express) enabled on the account (launch checklist B15).
CREATORS = "off"
CREATOR_COMMISSION_PCT = "30"        # of what the buyer paid, net of tax, less refunds
CREATOR_DISCOUNT_PCT = "10"          # the creator code's coupon (made once in Stripe as rite-creator-<pct>)
CREATOR_HOLD_DAYS = "15"             # past the 14-day refund window before a commission can be paid
CREATOR_MIN_PAYOUT_CENTS = "2500"    # $25; less carries to the next month
CREATOR_UNPAID_CAP_CENTS = "50000"   # $500 a creator can be paid before Mick lifts their cap in /admin/creators

# Ads (docs/automation-builds.md §10, src/ads.ts; launch checklist F). Spends money, so: off by default, hard caps, kill switch.
# ADS: "off" does nothing; "dry-run" reads Meta spend at 06:00 Brisbane daily, decides and logs (`ads_decision` events, the KPI
# email) without changing anything; "on" applies (raise 20% / hold / cut 30% / pause), never above the caps, never un-pauses.
ADS = "off"
ADS_DAILY_CAP = "200"     # whole USD per day; raise only per Gate B (growth plan §4)
ADS_MONTHLY_CAP = ""      # whole USD per calendar month (Brisbane); Mick sets it. Empty = the controller reports "missing config"
ADS_REF = "meta"          # buyers counted are purchases whose preview came in on ?r=meta (or ?r=meta-*), Rite's own data
META_CAMPAIGN_ID = ""     # the Advantage+ sales campaign (budget at campaign level); META_ADSET_ID instead if the budget is on an ad set
META_ADSET_ID = ""
META_API_VERSION = "v24.0"
# Conversions API: "on" sends a server-side Purchase (hashed email, order value, event_id = Checkout Session id) per paid
# reading or gift. Needs META_PIXEL_ID and the META_CAPI_TOKEN secret, and the privacy page line (checklist F3) first.
META_CAPI = "off"
META_PIXEL_ID = ""
META_TEST_EVENT_CODE = "" # Events Manager → Test events code, only while testing (F4)
# Automated data deletion (macro 5) needs an R2 bucket for the D1 export it takes first. Without this binding, delete
# requests go to Mick. To enable: wrangler r2 bucket create rite-support-exports, then uncomment:
# [[r2_buckets]]
# binding = "SUPPORT_EXPORTS"
# bucket_name = "rite-support-exports"

# Secrets (set with `wrangler secret put NAME`):
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY, RESEND_API_KEY
#   optional: POSTHOG_PERSONAL_API_KEY (Monday KPI email visits)
#   ads (build 10): META_CAPI_TOKEN (dataset token, Conversions API), META_ADS_TOKEN (system user, ads_management + ads_read),
#   META_APP_SECRET (only if the Meta app requires appsecret_proof)

[[d1_databases]]
binding = "DB"
database_name = "rite"
database_id = "080917d1-8478-4204-92ba-cc4f951eee60"   # replace: wrangler d1 create rite

[[kv_namespaces]]
binding = "CACHE"
id = "d6c3a395f8414c0e910e526d57700199"            # replace: wrangler kv namespace create CACHE

[triggers]
crons = ["0 * * * *"]  # hourly; the handler sends Saturn Season mail at 07:00 in each subscriber's own timezone

[observability]
enabled = true

[assets]
directory = "./public"

[ai]
binding = "AI"
