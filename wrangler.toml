name = "rite"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://rite.mickreal.workers.dev"   # switch to https://rite.report once the domain is attached
PRICE_FULL_CENTS = "2900"
PRICE_NOTIME_CENTS = "1900"
PRICE_SEASON_MONTHLY_CENTS = "700"
PRICE_SEASON_YEARLY_CENTS = "5900"
CURRENCY = "usd"
MODEL_REPORT = "claude-sonnet-5-5"
MODEL_PREVIEW = "claude-haiku-5-5"
TTS_VOICE = "luna"
ADMIN_EMAIL = "mail@mickreal.com"
POSTHOG_KEY = "phc_ybwtQEUxfgYeRSpCMHFL5uJX5GBHUv4JDzxx7HUPvh3T"
POSTHOG_HOST = "https://us.i.posthog.com"
# POSTHOG_PROJECT_ID = "12345"   # optional, with the POSTHOG_PERSONAL_API_KEY secret: visits in the Monday KPI email
FROM_EMAIL = "Rite <hello@rite.report>"
SUPPORT_EMAIL = "hello@rite.report"

# Secrets (set with `wrangler secret put NAME`):
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY, RESEND_API_KEY
#   optional: POSTHOG_PERSONAL_API_KEY (Monday KPI email visits)

[[d1_databases]]
binding = "DB"
database_name = "rite"
database_id = "080917d1-8478-4204-92ba-cc4f951eee60"   # replace: wrangler d1 create rite

[[kv_namespaces]]
binding = "CACHE"
id = "d6c3a395f8414c0e910e526d57700199"            # replace: wrangler kv namespace create CACHE

[triggers]
crons = ["0 * * * *"]  # hourly; the handler sends Saturn Season mail at 07:00 in each subscriber's own timezone

[observability]
enabled = true

[assets]
directory = "./public"

[ai]
binding = "AI"
